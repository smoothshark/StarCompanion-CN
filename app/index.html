<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星伴千境 · 对话编辑器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ef;
      --surface: #fffdf9;
      --surface-soft: #f9f7f2;
      --ink: #24231f;
      --muted: #716e66;
      --line: #ddd8cf;
      --line-strong: #c9c2b6;
      --accent: #6557d8;
      --accent-dark: #4c3fc0;
      --accent-soft: #eeebff;
      --user: #fff4df;
      --supporter: #eceaff;
      --danger: #b23b3b;
      --success: #287a55;
      --shadow: 0 16px 45px rgba(64, 56, 43, 0.08);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(101, 87, 216, 0.08), transparent 34rem),
        var(--bg);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(201, 194, 182, 0.75);
      background: rgba(245, 243, 239, 0.9);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 13px;
      color: white;
      background: linear-gradient(145deg, #8174ef, #5144c8);
      box-shadow: 0 8px 18px rgba(81, 68, 200, 0.24);
      font-size: 19px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .connection {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      white-space: nowrap;
    }

    .connection[data-state="online"] {
      color: var(--success);
      border-color: rgba(40, 122, 85, 0.25);
      background: #eff9f3;
    }

    .editor-name {
      width: 150px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 100px;
    }

    .record-bar {
      display: grid;
      grid-template-columns:
        minmax(150px, 0.75fr)
        minmax(170px, 0.9fr)
        minmax(120px, 0.55fr)
        minmax(260px, 1.7fr);
      gap: 12px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .selector-field {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .selector-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .record-select {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .btn {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      font-weight: 650;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .btn.primary {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .btn.primary:hover:not(:disabled) {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .btn.soft {
      color: var(--accent-dark);
      border-color: transparent;
      background: var(--accent-soft);
    }

    .btn.danger {
      color: var(--danger);
    }

    .btn.reviewed {
      color: var(--success);
      border-color: rgba(40, 122, 85, 0.28);
      background: #eff9f3;
    }

    .meta-strip {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 253, 249, 0.72);
    }

    .meta-item span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .meta-item strong,
    .meta-item input {
      display: block;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      border: 0;
      padding: 0;
      color: var(--ink);
      background: transparent;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 650;
    }

    .content-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(330px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .column {
      display: grid;
      gap: 18px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .panel-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .panel-body {
      padding: 20px;
    }

    .memory-input,
    .instruction-input,
    .turn textarea,
    .llm-field {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
      outline: none;
      resize: vertical;
    }

    .memory-input:focus,
    .instruction-input:focus,
    .turn textarea:focus,
    .llm-field:focus,
    .record-select:focus,
    .editor-name:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(101, 87, 216, 0.1);
    }

    .memory-input {
      min-height: 230px;
      padding: 14px;
      line-height: 1.75;
    }

    .char-count {
      margin-top: 8px;
      color: var(--muted);
      text-align: right;
      font-size: 11px;
    }

    .dialogue-list {
      display: grid;
      gap: 12px;
    }

    .turn {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .turn.user {
      background: var(--user);
    }

    .turn.supporter {
      background: var(--supporter);
    }

    .role-label {
      padding-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
    }

    .turn textarea {
      min-height: 82px;
      padding: 11px 12px;
      line-height: 1.65;
    }

    .dialogue-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }

    .llm-form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .llm-field {
      padding: 10px 11px;
    }

    .instruction-input {
      min-height: 120px;
      padding: 12px;
      line-height: 1.65;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .llm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .llm-message,
    .validation-message {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .llm-message.error,
    .validation-message.error {
      color: var(--danger);
    }

    .llm-message.success,
    .validation-message.success {
      color: var(--success);
    }

    .preview {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .preview.visible {
      display: block;
    }

    .preview h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    .preview-memory {
      max-height: 180px;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.65;
    }

    .preview-dialogue {
      margin-top: 10px;
      display: grid;
      gap: 7px;
    }

    .preview-turn {
      padding: 9px 10px;
      border-radius: 9px;
      background: var(--surface-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .preview-turn strong {
      margin-right: 6px;
      color: var(--accent-dark);
    }

    .empty {
      padding: 44px 20px;
      color: var(--muted);
      text-align: center;
    }

    .save-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      border-top: 1px solid var(--line);
      background: rgba(255, 253, 249, 0.94);
      backdrop-filter: blur(16px);
    }

    .save-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .save-state {
      color: var(--muted);
      font-size: 13px;
    }

    .save-state.dirty {
      color: #9a641d;
    }

    .save-state.saved {
      color: var(--success);
    }

    .save-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .record-bar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meta-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .header-inner,
      .shell,
      .save-inner {
        width: min(100% - 20px, 1180px);
      }

      .header-inner {
        align-items: flex-start;
        padding: 12px 0;
      }

      .brand p,
      .connection {
        display: none;
      }

      .editor-name {
        width: 120px;
      }

      .record-bar {
        grid-template-columns: 1fr;
      }

      .meta-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel-header,
      .panel-body {
        padding: 16px;
      }

      .turn {
        grid-template-columns: 46px minmax(0, 1fr);
        gap: 8px;
      }
    }

    /* White macOS-inspired visual system */
    :root {
      --bg: #f2f3f5;
      --surface: #ffffff;
      --surface-soft: #f7f7f8;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.09);
      --line-strong: rgba(0, 0, 0, 0.15);
      --accent: #007aff;
      --accent-dark: #0066d6;
      --accent-soft: #eaf3ff;
      --user: #f5f5f7;
      --supporter: #f0f6ff;
      --danger: #d92d20;
      --success: #248a3d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.055);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #f8f8fa 0, var(--bg) 260px);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: rgba(0, 122, 255, 0.18);
    }

    button:disabled {
      opacity: 0.46;
    }

    .app-header {
      border-bottom-color: rgba(0, 0, 0, 0.08);
      background: rgba(250, 250, 252, 0.82);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .header-inner {
      width: min(1280px, calc(100% - 32px));
      min-height: 64px;
    }

    .brand {
      gap: 16px;
    }

    .window-controls {
      width: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .window-controls span {
      width: 12px;
      height: 12px;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.28);
    }

    .window-controls .close {
      background: #ff5f57;
    }

    .window-controls .minimize {
      background: #febc2e;
    }

    .window-controls .zoom {
      background: #28c840;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin-top: 3px;
      font-size: 11px;
    }

    .connection {
      position: relative;
      padding: 6px 10px 6px 24px;
      background: rgba(255, 255, 255, 0.76);
      font-size: 11px;
    }

    .connection::before {
      position: absolute;
      top: 50%;
      left: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8e8e93;
      content: "";
      transform: translateY(-50%);
    }

    .connection[data-state="online"] {
      border-color: rgba(36, 138, 61, 0.18);
      background: #f2faf4;
    }

    .connection[data-state="online"]::before {
      background: #30d158;
      box-shadow: 0 0 0 3px rgba(48, 209, 88, 0.12);
    }

    .editor-name {
      height: 34px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      outline: none;
      font-size: 12px;
    }

    .shell {
      width: min(1280px, calc(100% - 32px));
      margin: 18px auto 96px;
    }

    .record-bar {
      padding: 15px 16px 16px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .selector-field label,
    .field label {
      font-size: 11px;
      font-weight: 600;
    }

    .record-select {
      height: 38px;
      padding: 8px 11px;
      border-radius: 8px;
      color: var(--ink);
      background: #f7f7f8;
      outline: none;
      font-size: 13px;
    }

    .btn {
      min-height: 36px;
      padding: 8px 13px;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #f7f7f8);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.025);
      font-size: 12px;
      font-weight: 600;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease, transform 80ms ease;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.08);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn.primary {
      border-color: var(--accent);
      background: linear-gradient(180deg, #1685ff, var(--accent));
      box-shadow: 0 1px 2px rgba(0, 85, 180, 0.18);
    }

    .btn.primary:hover:not(:disabled) {
      border-color: var(--accent-dark);
      background: linear-gradient(180deg, #087cf2, var(--accent-dark));
    }

    .btn.soft {
      border-color: rgba(0, 122, 255, 0.12);
      background: var(--accent-soft);
    }

    .btn.danger {
      border-color: rgba(217, 45, 32, 0.14);
      background: #fff8f7;
    }

    .btn.reviewed {
      border-color: rgba(36, 138, 61, 0.2);
      background: #f1faf3;
    }

    .meta-strip {
      margin-top: 12px;
    }

    .meta-item {
      padding: 9px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.88);
    }

    .content-grid {
      margin-top: 16px;
      gap: 16px;
    }

    .column {
      gap: 16px;
    }

    .panel {
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-header {
      padding: 15px 18px;
      background: linear-gradient(180deg, #ffffff, #fbfbfc);
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .panel-body {
      padding: 18px;
    }

    .memory-input,
    .instruction-input,
    .turn textarea,
    .llm-field {
      border-color: rgba(0, 0, 0, 0.13);
      border-radius: 9px;
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.025);
    }

    .memory-input:focus,
    .instruction-input:focus,
    .turn textarea:focus,
    .llm-field:focus,
    .record-select:focus,
    .editor-name:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
    }

    .memory-input {
      min-height: 220px;
      line-height: 1.72;
    }

    .instruction-input {
      min-height: 250px;
    }

    .turn {
      padding: 10px;
      border-radius: 11px;
    }

    .role-label {
      margin-top: 4px;
      padding: 7px 5px;
      border-radius: 7px;
      font-weight: 650;
    }

    .turn.user .role-label {
      background: #e9e9ec;
    }

    .turn.supporter .role-label {
      color: #0066cc;
      background: #dcecff;
    }

    .turn textarea {
      background: rgba(255, 255, 255, 0.92);
    }

    .check-row {
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
    }

    .check-row input {
      accent-color: var(--accent);
    }

    .preview-memory {
      border-radius: 9px;
    }

    .preview-turn {
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .save-bar {
      border-top-color: rgba(0, 0, 0, 0.09);
      background: rgba(249, 249, 251, 0.86);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.035);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
    }

    .save-inner {
      width: min(1280px, calc(100% - 32px));
      min-height: 64px;
    }

    @media (max-width: 640px) {
      .header-inner,
      .shell,
      .save-inner {
        width: min(100% - 20px, 1280px);
      }

      .header-inner {
        min-height: 58px;
        padding: 8px 0;
      }

      .window-controls {
        display: none;
      }

      .shell {
        margin-top: 12px;
        margin-bottom: 124px;
      }

      .panel-header,
      .panel-body {
        padding: 16px;
      }

      .save-inner {
        min-height: auto;
        padding: 9px 0;
        align-items: stretch;
        flex-direction: column;
        gap: 7px;
      }

      .save-state {
        text-align: center;
      }

      .save-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .save-actions .btn {
        padding: 7px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="window-controls" aria-hidden="true">
          <span class="close"></span>
          <span class="minimize"></span>
          <span class="zoom"></span>
        </div>
        <div>
          <h1>星伴千境 · 对话编辑器</h1>
          <p>只编辑 LLM 记忆与多轮对话</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="connection" id="connectionState" data-state="loading">正在连接 SQLite</span>
        <input class="editor-name" id="editorName" maxlength="64" placeholder="修改人">
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="record-bar">
      <div class="selector-field">
        <label for="categorySelect">母类别</label>
        <select class="record-select" id="categorySelect" disabled>
          <option>正在载入母类别…</option>
        </select>
      </div>
      <div class="selector-field">
        <label for="mechanismSelect">场景</label>
        <select class="record-select" id="mechanismSelect" disabled>
          <option>请先选择母类别</option>
        </select>
      </div>
      <div class="selector-field">

                <textarea class="instruction-input" id="llmInstruction">1. 在不改变场景、年龄、人物关系、事实和评测考点的前提下，先改写 LLM 记忆。记忆应符合年龄和真实人际互动逻辑，保持【用户画像】【星仔记忆】【当前触发】【承接要点】的长期记忆格式；生活化、不小说化，不补写没有依据的事实。
2. 改写星仔回复时不要换词复述用户原话。每次回复都要向前推进一层：从表面事件中试探性地识别更深的担心或关系需要，探索用户真正想确认、表达或达成的目的，再结合情境给予具体的情绪支持、澄清问题或低压力下一步。
3. 推断必须有对话依据，并使用“是不是”“听起来更像”“也许你在意的不是……”等试探语气，不替用户下结论。避免连续使用“这种……很难受”“换谁都……”等模板，不写咨询报告腔、说教和过度文学化表达。
4. 保留 user 原话时，星仔回复既要回应上一条 user，也要能自然承接下一条固定 user；每条回复删去对用户事实的复述后，仍必须包含有价值的新信息。</textarea>

  <script>
    const API_WORKSPACE = "/api/workspace";
    const API_RECORD = "/api/workspace-record";
    const API_HEALTH = "/api/health";
    const API_SCENES = "/api/scenes";
    const SILICONFLOW_URL = "https://api.siliconflow.cn/v1/chat/completions";
    const DEFAULT_SILICONFLOW_API_KEY = "sk-ytegsneiatonsqdyqygofgwladjbhwncxchlovfuzbbpghkq";
    const DEFAULT_LLM_MODEL = "Pro/moonshotai/Kimi-K2.6";
    const STORAGE_EDITOR = "a1_editor_name";
    const STORAGE_KEY = "a1_siliconflow_api_key_embedded_v2";
    const STORAGE_MODEL = "a1_siliconflow_model_kimi_default_v2";
    const STORAGE_LAST_RECORD = "starcompanion_minimal_last_record";

    const ageLabels = {
      preschool: "幼儿园",
      primary_lower: "小学低年级",
      primary_upper: "小学高年级",
      middle_school: "初中",
      high_school: "高中",
      college: "大学",
      workplace: "职场"
    };

    const ageOrder = [
      "preschool",
      "primary_lower",
      "primary_upper",
      "middle_school",
      "high_school",
      "college",
      "workplace"
    ];

    const statusLabels = {
      draft: "草稿",
      pending_review: "AI 待审",
      completed: "人工确认"
    };

    const appState = {
      entries: [],
      records: {},
      scenes: [],
      sceneById: {},
      sceneAgeIndex: {},
      mechanismSceneIndex: {},
      categoryMechanismIndex: {},
      currentKey: "",
      currentRecord: null,
      dialogue: [],
      dirty: false,
      suggestion: null,
      loading: false
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value == null || value === "" ? "—" : String(value);
    }

    function setConnection(text, state) {
      const el = document.getElementById("connectionState");
      el.textContent = text;
      el.dataset.state = state;
    }

    function setLlmMessage(text, type) {
      const el = document.getElementById("llmMessage");
      el.textContent = text || "";
      el.className = "llm-message" + (type ? " " + type : "");
    }

    function setSaveState(text, type) {
      const el = document.getElementById("saveState");
      el.textContent = text;
      el.className = "save-state" + (type ? " " + type : "");
    }

    function updateHumanReviewButton() {
      const button = document.getElementById("toggleHumanReview");
      const reviewed = Boolean(appState.currentRecord && appState.currentRecord.status === "completed");
      button.disabled = !appState.currentRecord;
      button.setAttribute("aria-pressed", String(reviewed));
      button.classList.toggle("reviewed", reviewed);
      button.textContent = reviewed ? "✓ 人工审核：已审核" : "人工审核：未审核";
      button.title = reviewed ? "点击取消人工审核，恢复为 AI 待审" : "点击标记为已人工审核";
    }

    function markDirty() {
      if (!appState.currentRecord) return;
      appState.dirty = true;
      setSaveState("有尚未保存的修改", "dirty");
      validateCurrent();
    }

    function recordSceneId(recordKey, record) {
      return record.sceneId || recordKey.split("::")[1] || "";
    }

    function recordAgeBand(recordKey, record) {
      const sample = record && record.sample ? record.sample : {};
      return record.ageBand || sample.age_band || recordKey.split("::")[0] || "";
    }

    function buildSceneAgeIndex() {
      const index = {};
      appState.entries.forEach(function(entry) {
        const recordKey = entry[0];
        const record = entry[1];
        const sceneId = recordSceneId(recordKey, record);
        const ageBand = recordAgeBand(recordKey, record);
        if (!sceneId || !ageBand) return;
        if (!index[sceneId]) index[sceneId] = {};
        index[sceneId][ageBand] = recordKey;
      });
      appState.sceneAgeIndex = index;

      const mechanismIndex = {};
      const categoryIndex = {};
      appState.scenes
        .slice()
        .sort(function(a, b) {
          return String(a.id || "").localeCompare(String(b.id || ""), "zh-CN", { numeric: true });
        })
        .forEach(function(scene) {
          const category = String(scene.category || "").trim();
          const mechanism = String(scene.mechanism || "").trim();
          if (!category || !mechanism || !index[scene.id]) return;
          if (!mechanismIndex[mechanism]) mechanismIndex[mechanism] = [];
          mechanismIndex[mechanism].push(scene.id);
          if (!categoryIndex[category]) categoryIndex[category] = [];
          if (!categoryIndex[category].includes(mechanism)) categoryIndex[category].push(mechanism);
        });
      appState.mechanismSceneIndex = mechanismIndex;
      appState.categoryMechanismIndex = categoryIndex;
    }

    function populateCategorySelect(preferredCategory) {
      const select = document.getElementById("categorySelect");
      select.replaceChildren();
      const categories = Object.keys(appState.categoryMechanismIndex);
      categories.forEach(function(category) {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
      select.disabled = !categories.length;
      if (preferredCategory && appState.categoryMechanismIndex[preferredCategory]) {
        select.value = preferredCategory;
      } else if (categories.length) {
        select.value = categories[0];
      }
      return select.value;
    }

    function populateMechanismSelect(category, preferredMechanism) {
      const select = document.getElementById("mechanismSelect");
      select.replaceChildren();
      const mechanisms = appState.categoryMechanismIndex[category] || [];
      mechanisms.forEach(function(mechanism) {
        const option = document.createElement("option");
        option.value = mechanism;
        option.textContent = mechanism;
        select.appendChild(option);
      });
      select.disabled = !mechanisms.length;
      if (preferredMechanism && mechanisms.includes(preferredMechanism)) {
        select.value = preferredMechanism;
      } else if (mechanisms.length) {
        select.value = mechanisms[0];
      }
      return select.value;
    }

    function populateAgeSelect(mechanism, preferredAge) {
      const select = document.getElementById("ageSelect");
      select.replaceChildren();
      const available = new Set();
      (appState.mechanismSceneIndex[mechanism] || []).forEach(function(sceneId) {
        Object.keys(appState.sceneAgeIndex[sceneId] || {}).forEach(function(ageBand) {
          available.add(ageBand);
        });
      });
      const ages = ageOrder.filter(function(ageBand) {
        return available.has(ageBand);
      });
      ages.forEach(function(ageBand) {
        const option = document.createElement("option");
        option.value = ageBand;
        option.textContent = ageLabels[ageBand] || ageBand;
        select.appendChild(option);
      });
      select.disabled = !ages.length;
      if (preferredAge && available.has(preferredAge)) {
        select.value = preferredAge;
      } else if (ages.length) {
        select.value = ages[0];
      }
      return select.value;
    }

    function populateEventSelect(mechanism, ageBand, preferredSceneId) {
      const select = document.getElementById("eventSelect");
      select.replaceChildren();
      const sceneIds = (appState.mechanismSceneIndex[mechanism] || []).filter(function(sceneId) {
        return Boolean(appState.sceneAgeIndex[sceneId] && appState.sceneAgeIndex[sceneId][ageBand]);
      });
      sceneIds.forEach(function(sceneId) {
        const scene = appState.sceneById[sceneId] || {};
        const option = document.createElement("option");
        option.value = sceneId;
        option.textContent = scene.event || sceneId;
        option.title = sceneId;
        select.appendChild(option);
      });
      select.disabled = !sceneIds.length;
      if (preferredSceneId && sceneIds.includes(preferredSceneId)) {
        select.value = preferredSceneId;
      } else if (sceneIds.length) {
        select.value = sceneIds[0];
      }
      return select.value;
    }

    function syncSceneAgeSelectors(recordKey, record) {
      if (!record) return;
      const sceneId = recordSceneId(recordKey, record);
      const ageBand = recordAgeBand(recordKey, record);
      const scene = appState.sceneById[sceneId] || {};
      const category = populateCategorySelect(scene.category || "");
      document.getElementById("categorySelect").value = category;
      const mechanism = populateMechanismSelect(category, scene.mechanism || "");
      document.getElementById("mechanismSelect").value = mechanism;
      populateAgeSelect(mechanism, ageBand);
      populateEventSelect(mechanism, ageBand, sceneId);
    }

    function selectedRecordKey() {
      const sceneId = document.getElementById("eventSelect").value;
      const ageBand = document.getElementById("ageSelect").value;
      return appState.sceneAgeIndex[sceneId] && appState.sceneAgeIndex[sceneId][ageBand]
        ? appState.sceneAgeIndex[sceneId][ageBand]
        : "";
    }

    function clearSuggestion() {
      appState.suggestion = null;
      document.getElementById("suggestionPreview").classList.remove("visible");
      document.getElementById("previewMemory").textContent = "";
      document.getElementById("previewDialogue").replaceChildren();
      document.getElementById("applySuggestion").disabled = true;
      document.getElementById("discardSuggestion").disabled = true;
    }

    function showRecord(recordKey, force) {
      if (!force && appState.dirty && !window.confirm("当前修改尚未保存，确定切换卡片吗？")) {
        syncSceneAgeSelectors(appState.currentKey, appState.currentRecord);
        return false;
      }
      const record = appState.records[recordKey];
      if (!record || !record.sample) return false;

      appState.currentKey = recordKey;
      appState.currentRecord = clone(record);
      appState.dialogue = clone(Array.isArray(record.sample.history) ? record.sample.history : []);
      appState.dirty = false;
      clearSuggestion();
      setLlmMessage("");

      syncSceneAgeSelectors(recordKey, record);
      document.getElementById("memoryInput").value = record.sample.authoring && record.sample.authoring.situation_summary
        ? record.sample.authoring.situation_summary
        : "";
      document.getElementById("revisionInput").value = record.sample.revision || 1;

      setText("metaScene", record.sceneId || recordKey.split("::")[1]);
      setText("metaAge", ageLabels[record.ageBand || record.sample.age_band] || record.ageBand || record.sample.age_band);
      setText("metaSpecificAge", record.sample.specific_age);
      setText("metaSceneType", record.sample.scene_type);
      setText("metaStatus", statusLabels[record.status] || record.status);

      renderDialogue();
      updateMemoryCount();
      validateCurrent();
      updateHumanReviewButton();
      setSaveState("当前卡片已载入", "saved");
      document.getElementById("deleteRecord").disabled = false;
      document.getElementById("saveRecord").disabled = false;
      localStorage.setItem(STORAGE_LAST_RECORD, recordKey);
      return true;
    }

    function renderDialogue() {
      const list = document.getElementById("dialogueList");
      list.replaceChildren();
      if (!appState.dialogue.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "这张卡片还没有对话";
        list.appendChild(empty);
        return;
      }

      appState.dialogue.forEach(function(turn, index) {
        const item = document.createElement("div");
        item.className = "turn " + turn.role;

        const role = document.createElement("div");
        role.className = "role-label";
        role.textContent = turn.role === "supporter" ? "星仔 " + (index + 1) : "用户 " + (index + 1);

        const textarea = document.createElement("textarea");
        textarea.value = turn.content || "";
        textarea.maxLength = turn.role === "supporter" ? 200 : 500;
        textarea.dataset.index = String(index);
        textarea.addEventListener("input", function(event) {
          const turnIndex = Number(event.target.dataset.index);
          appState.dialogue[turnIndex].content = event.target.value;
          markDirty();
        });

        item.append(role, textarea);
        list.appendChild(item);
      });

      document.getElementById("addPair").disabled = appState.dialogue.length > 10;
      document.getElementById("removePair").disabled = appState.dialogue.length < 8;
    }

    function updateMemoryCount() {
      const count = Array.from(document.getElementById("memoryInput").value).length;
      document.getElementById("memoryCount").textContent = count + " 字";
    }

    function validationIssues(memory, dialogue) {
      const issues = [];
      if (!String(memory || "").trim()) issues.push("LLM 记忆不能为空");
      if (!Array.isArray(dialogue) || dialogue.length < 6 || dialogue.length > 12) {
        issues.push("对话条数必须为 6–12");
        return issues;
      }
      if (dialogue[dialogue.length - 1].role !== "user") issues.push("最后一条必须是 user");
      const expectedStart = dialogue.length % 2 === 1 ? "user" : "supporter";
      if (dialogue[0].role !== expectedStart) issues.push(dialogue.length + " 条对话应从 " + expectedStart + " 开始");

      dialogue.forEach(function(turn, index) {
        if (!turn || !["user", "supporter"].includes(turn.role)) {
          issues.push("第 " + (index + 1) + " 条角色无效");
          return;
        }
        if (!String(turn.content || "").trim()) issues.push("第 " + (index + 1) + " 条内容为空");
        if (index > 0 && dialogue[index - 1].role === turn.role) {
          issues.push("第 " + index + "–" + (index + 1) + " 条角色未交替");
        }
        const max = turn.role === "user" ? 500 : 200;
        if (Array.from(String(turn.content || "")).length > max) {
          issues.push("第 " + (index + 1) + " 条超过 " + max + " 字");
        }
      });
      return issues;
    }

    function validateCurrent() {
      const memory = document.getElementById("memoryInput").value;
      const issues = validationIssues(memory, appState.dialogue);
      const el = document.getElementById("validationMessage");
      if (issues.length) {
        el.textContent = issues[0] + (issues.length > 1 ? "；另有 " + (issues.length - 1) + " 个问题" : "");
        el.className = "validation-message error";
      } else {
        el.textContent = "格式检查通过";
        el.className = "validation-message success";
      }
      return issues;
    }

    function addDialoguePair() {
      if (!appState.currentRecord || appState.dialogue.length > 10) return;
      const insertAt = Math.max(0, appState.dialogue.length - 1);
      appState.dialogue.splice(
        insertAt,
        0,
        { role: "user", content: "" },
        { role: "supporter", content: "" }
      );
      renderDialogue();
      markDirty();
    }

    function removeDialoguePair() {
      if (!appState.currentRecord || appState.dialogue.length < 8) return;
      const removeAt = appState.dialogue.length - 3;
      appState.dialogue.splice(removeAt, 2);
      renderDialogue();
      markDirty();
    }

    function recordFromEditor() {
      const record = clone(appState.currentRecord);
      record.updatedAt = new Date().toISOString();
      record.sample.revision = Math.max(1, Number(document.getElementById("revisionInput").value) || 1);
      record.sample.history = clone(appState.dialogue).map(function(turn) {
        return { role: turn.role, content: String(turn.content || "").trim() };
      });
      record.sample.authoring = record.sample.authoring || {};
      record.sample.authoring.situation_summary = document.getElementById("memoryInput").value.trim();
      return record;
    }

    async function saveCurrentRecord() {
      if (!appState.currentRecord) return;
      const editorName = document.getElementById("editorName").value.trim();
      if (!editorName) {
        setSaveState("请先填写修改人", "dirty");
        document.getElementById("editorName").focus();
        return;
      }
      const issues = validateCurrent();
      if (issues.length) {
        setSaveState("格式检查未通过，暂未保存", "dirty");
        return;
      }

      const button = document.getElementById("saveRecord");
      button.disabled = true;
      button.textContent = "保存中…";
      setSaveState("正在写入 SQLite", "");

      const record = recordFromEditor();

      try {
        const response = await fetch(API_RECORD, {
          method: "PUT",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({
            recordKey: appState.currentKey,
            record: record,
            editorName: editorName,
            action: "minimal_dialogue_edit"
          })
        });
        const payload = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(payload.error || "HTTP " + response.status);

        const savedRecord = payload.record || record;
        appState.records[appState.currentKey] = clone(savedRecord);
        appState.currentRecord = clone(savedRecord);
        appState.dirty = false;
        localStorage.setItem(STORAGE_EDITOR, editorName);
        updateHumanReviewButton();
        setSaveState("已保存到 SQLite", "saved");
      } catch (error) {
        setSaveState("保存失败：" + (error.message || error), "dirty");
      } finally {
        button.disabled = false;
        button.textContent = "保存当前卡片";
      }
    }

    async function toggleHumanReview() {
      if (!appState.currentRecord || !appState.currentKey) return;
      const editorName = document.getElementById("editorName").value.trim();
      if (!editorName) {
        setSaveState("请先填写修改人，再更新审核状态", "dirty");
        document.getElementById("editorName").focus();
        return;
      }

      const wasReviewed = appState.currentRecord.status === "completed";
      if (appState.dirty && !window.confirm("当前有尚未保存的修改。切换人工审核状态时会同时保存这些修改，是否继续？")) {
        return;
      }
      const issues = validateCurrent();
      if (issues.length) {
        setSaveState("格式检查未通过，暂未更新审核状态", "dirty");
        return;
      }

      const button = document.getElementById("toggleHumanReview");
      const saveButton = document.getElementById("saveRecord");
      const deleteButton = document.getElementById("deleteRecord");
      button.disabled = true;
      saveButton.disabled = true;
      deleteButton.disabled = true;
      button.textContent = "更新审核状态中…";
      setSaveState("正在写入人工审核状态", "");

      const record = recordFromEditor();
      record.status = wasReviewed ? "pending_review" : "completed";
      record.humanConfirmedAt = wasReviewed ? null : new Date().toISOString();
      record.confirmationSource = wasReviewed ? null : "minimal_dialogue_editor";

      try {
        const response = await fetch(API_RECORD, {
          method: "PUT",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({
            recordKey: appState.currentKey,
            record: record,
            editorName: editorName,
            action: wasReviewed ? "reopen_human_review" : "mark_human_reviewed"
          })
        });
        const payload = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(payload.error || "HTTP " + response.status);

        const savedRecord = payload.record || record;
        appState.records[appState.currentKey] = clone(savedRecord);
        appState.currentRecord = clone(savedRecord);
        appState.dirty = false;
        localStorage.setItem(STORAGE_EDITOR, editorName);
        setText("metaStatus", statusLabels[savedRecord.status] || savedRecord.status);
        setSaveState(wasReviewed ? "已取消人工审核，恢复为 AI 待审" : "已标记为人工审核", "saved");
      } catch (error) {
        setSaveState("审核状态更新失败：" + (error.message || error), "dirty");
      } finally {
        updateHumanReviewButton();
        saveButton.disabled = !appState.currentRecord;
        deleteButton.disabled = !appState.currentRecord;
      }
    }

    function clearCurrentRecord() {
      appState.currentKey = "";
      appState.currentRecord = null;
      appState.dialogue = [];
      appState.dirty = false;
      clearSuggestion();

      ["categorySelect", "mechanismSelect", "ageSelect", "eventSelect"].forEach(function(id) {
        const select = document.getElementById(id);
        select.replaceChildren();
        select.disabled = true;
      });
      document.getElementById("memoryInput").value = "";
      document.getElementById("revisionInput").value = 1;
      ["metaScene", "metaAge", "metaSpecificAge", "metaSceneType", "metaStatus"].forEach(function(id) {
        setText(id, "");
      });
      document.getElementById("dialogueList").innerHTML = '<div class="empty">SQLite 中已经没有可编辑案例</div>';
      document.getElementById("addPair").disabled = true;
      document.getElementById("removePair").disabled = true;
      updateHumanReviewButton();
      updateMemoryCount();
      localStorage.removeItem(STORAGE_LAST_RECORD);
    }

    async function deleteCurrentRecord() {
      if (!appState.currentRecord || !appState.currentKey) return;
      const editorName = document.getElementById("editorName").value.trim();
      if (!editorName) {
        setSaveState("请先填写修改人，再删除案例", "dirty");
        document.getElementById("editorName").focus();
        return;
      }

      const recordKey = appState.currentKey;
      const record = appState.currentRecord;
      const sceneId = recordSceneId(recordKey, record);
      const ageBand = recordAgeBand(recordKey, record);
      const scene = appState.sceneById[sceneId] || {};
      const path = [
        scene.category,
        scene.mechanism,
        ageLabels[ageBand] || ageBand,
        scene.event || sceneId
      ].filter(Boolean).join(" → ");
      const dirtyWarning = appState.dirty ? "\n当前尚未保存的修改也会一起丢失。" : "";
      const confirmed = window.confirm(
        "确定删除当前案例？\n\n" + path + dirtyWarning +
        "\n\n只会删除这个具体年龄案例，不会删除场景或其他年龄分支。删除快照会保留在版本记录中。"
      );
      if (!confirmed) return;

      const button = document.getElementById("deleteRecord");
      const saveButton = document.getElementById("saveRecord");
      button.disabled = true;
      saveButton.disabled = true;
      button.textContent = "删除中…";
      setSaveState("正在从 SQLite 删除当前案例", "");

      try {
        const response = await fetch(API_RECORD, {
          method: "DELETE",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({
            recordKey: recordKey,
            editorName: editorName,
            action: "delete_invalid_scene_age_case"
          })
        });
        const payload = await response.json().catch(function() { return {}; });
        if (!response.ok) throw new Error(payload.error || "HTTP " + response.status);
        if (!payload.deleted) throw new Error("当前案例不存在，可能已被其他人删除");

        const removedIndex = appState.entries.findIndex(function(entry) {
          return entry[0] === recordKey;
        });
        delete appState.records[recordKey];
        appState.entries = Object.entries(appState.records).sort(function(a, b) {
          return a[0].localeCompare(b[0], "zh-CN", { numeric: true });
        });
        appState.dirty = false;
        localStorage.setItem(STORAGE_EDITOR, editorName);
        buildSceneAgeIndex();

        if (appState.entries.length) {
          const nextIndex = Math.min(Math.max(removedIndex, 0), appState.entries.length - 1);
          showRecord(appState.entries[nextIndex][0], true);
          setSaveState("已删除当前案例，并切换到下一条", "saved");
        } else {
          clearCurrentRecord();
          setSaveState("当前案例已删除，工作区暂无其他案例", "saved");
        }
        setConnection("SQLite · " + appState.entries.length + " 条", "online");
      } catch (error) {
        setSaveState("删除失败：" + (error.message || error), "dirty");
      } finally {
        button.textContent = "删除当前案例";
        button.disabled = !appState.currentRecord;
        saveButton.disabled = !appState.currentRecord;
      }
    }

    function extractJsonObject(text) {
      const source = String(text || "").trim();
      const fenced = source.match(/\x60\x60\x60(?:json)?\s*([\s\S]*?)\x60\x60\x60/i);
      const candidate = fenced ? fenced[1].trim() : source;
      const start = candidate.indexOf("{");
      const end = candidate.lastIndexOf("}");
      if (start < 0 || end <= start) throw new Error("模型没有返回 JSON 对象");
      const jsonText = candidate.slice(start, end + 1);
      try {
        return JSON.parse(jsonText);
      } catch (firstError) {
        const repaired = jsonText
          .replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*:)/g, '$1"$2"$3')
          .replace(/([{,]\s*)'([^'\r\n]+)'(\s*:)/g, '$1"$2"$3')
          .replace(/,\s*([}\]])/g, "$1");
        try {
          return JSON.parse(repaired);
        } catch {
          throw new Error("模型返回的 JSON 格式不完整，请重新生成（" + firstError.message + "）");
        }
      }
    }

    function normalizeSuggestion(raw, preserveUser) {
      const memory = String(raw.memory || raw.situation_summary || "").trim();
      const sourceDialogue = raw.dialogue || raw.history;
      if (!Array.isArray(sourceDialogue)) throw new Error("模型结果缺少 dialogue");
      const dialogue = sourceDialogue.map(function(turn) {
        return {
          role: turn && turn.role === "assistant" ? "supporter" : String(turn && turn.role || ""),
          content: String(turn && (turn.content == null ? turn.text : turn.content) || "").trim()
        };
      });
      const issues = validationIssues(memory, dialogue);
      if (issues.length) throw new Error(issues[0]);

      if (preserveUser) {
        const originalUsers = appState.dialogue.filter(function(turn) { return turn.role === "user"; });
        const generatedUsers = dialogue.filter(function(turn) { return turn.role === "user"; });
        if (originalUsers.length !== generatedUsers.length) throw new Error("模型改变了 user 轮数量");
        for (let index = 0; index < originalUsers.length; index += 1) {
          if (originalUsers[index].content !== generatedUsers[index].content) {
            throw new Error("模型改动了第 " + (index + 1) + " 条 user 原话");
          }
        }
      }
      return { memory: memory, dialogue: dialogue };
    }

    function buildLlmPrompt(preserveUser) {
      const sample = appState.currentRecord.sample;
      const authoring = sample.authoring || {};
      const input = {
        scene_id: appState.currentRecord.sceneId,
        age_band: sample.age_band,
        specific_age: sample.specific_age,
        scene_type: sample.scene_type,
        emotion_valence: sample.emotion_valence,
        memory: document.getElementById("memoryInput").value,
        dialogue: appState.dialogue,
        evaluation_hints: {
          context_dependencies: authoring.context_dependencies || [],
          valid_response_directions: authoring.valid_response_directions || [],
          forbidden_response_patterns: authoring.forbidden_response_patterns || [],
          human_only: Boolean(authoring.human_only)
        }
      };
      const instruction = document.getElementById("llmInstruction").value.trim();
      const userRule = preserveUser
        ? "所有 role=user 的 content 必须逐字不变，数量和位置也不能改变。"
        : "可以修改 user 与 supporter，但必须保持原场景、事实、人物关系和评测考点。";
      return [
        "请修改下面这条中文情感陪伴评测数据。",
        "用户的自定义要求：" + instruction,
        userRule,
        "保持对话条数不变，角色严格交替，最后一条为 user。",
        "supporter 固定是星仔：兔子状毛绒外星 AI 情感陪玩玩具。",
        "把整段对话设计成逐步推进的支持过程，而不是逐轮复述：识别情绪背后的成因或关系需要 → 用一个具体问题澄清用户期待的目的 → 结合已有记忆提供情绪支撑、表达选择或低压力下一步。可以按现有轮数灵活分配这些功能，不必机械套用固定句式。",
        "每条 supporter 回复必须至少带来一种新信息：更准确的核心矛盾、试探性的深层理解、具体的澄清问题、基于记忆的连接，或用户可以选择的下一步。若删去对上一条 user 的事实复述后没有新内容，这条回复必须重写。",
        "不要用同义改写重复用户刚说过的人物、物件、动作和情绪；不要连续使用‘这种……很难受/很磨人’‘换谁都……’‘你想……又不敢……’等镜像模板。情绪支持要落在用户真正害怕失去、希望确认或希望恢复的东西上。",
        "对深层原因只能依据输入做试探性推断，使用自然口语询问或核对，不能诊断、读心或替用户宣布关系结论。至少一条 supporter 回复要探索用户希望从对方那里得到什么、希望关系发生什么变化，问题要具体且可回答。",
        "当 user 原话被锁定时，改写后的 supporter 不仅要回应前一条 user，还要为后一条固定 user 提供自然语境；不能让后一条 user 看起来答非所问。",
        "不要加入诊断、说教、排他依赖或标准答案提示。",
        "LLM 记忆保持【用户画像】【星仔记忆】【当前触发】【承接要点】四段结构，内容生活化、可检索，不使用小说旁白或煽情修辞。",
        "输出前逐条自检 supporter：是否只是复述、是否有推进、是否过度推断、是否能承接下一条 user；不合格就先重写。不要输出自检过程。",
        "只输出一个 JSON 对象，字段严格为 memory 和 dialogue。",
        "dialogue 每项字段严格为 role 和 content。",
        "待修改数据：",
        JSON.stringify(input)
      ].join("\n");
    }

    async function requestLlmJson(apiKey, model, messages, temperature) {
      const response = await fetch(SILICONFLOW_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: messages,
          response_format: { type: "json_object" },
          temperature: temperature,
          max_tokens: 6000
        })
      });
      const payload = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        const apiMessage = payload.error && payload.error.message
          ? payload.error.message
          : payload.message || (typeof payload.error === "string" ? payload.error : "HTTP " + response.status);
        const apiError = new Error(apiMessage);
        apiError.status = response.status;
        const retryAfter = response.headers.get("retry-after");
        const retryAfterSeconds = Number(retryAfter);
        if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {
          apiError.retryAfterMs = retryAfterSeconds * 1000;
        } else if (retryAfter) {
          const retryAt = Date.parse(retryAfter);
          if (Number.isFinite(retryAt)) apiError.retryAfterMs = Math.max(0, retryAt - Date.now());
        }
        throw apiError;
      }
      const content = payload.choices && payload.choices[0] && payload.choices[0].message
        ? payload.choices[0].message.content
        : "";
      if (!content) throw new Error("模型没有返回可用内容");
      return content;
    }

    function isRetryableLlmError(error) {
      const status = Number(error && error.status) || 0;
      if ([408, 425, 429, 500, 502, 503, 504].includes(status)) return true;
      const message = String(error && error.message || error || "").toLowerCase();
      return /too busy|overload|try again later|temporar(?:y|ily)|service unavailable|timeout|timed out|network|failed to fetch/.test(message);
    }

    function waitFor(milliseconds) {
      return new Promise(function(resolve) {
        window.setTimeout(resolve, milliseconds);
      });
    }

    async function requestLlmJsonWithRetry(apiKey, model, messages, temperature, stageLabel) {
      const maximumAttempts = 3;
      let lastError = null;
      for (let attempt = 1; attempt <= maximumAttempts; attempt += 1) {
        try {
          return await requestLlmJson(apiKey, model, messages, temperature);
        } catch (error) {
          lastError = error;
          if (!isRetryableLlmError(error) || attempt >= maximumAttempts) break;
          const defaultDelay = attempt === 1 ? 3000 : 8000;
          const requestedDelay = Number(error && error.retryAfterMs) || 0;
          const delay = Math.min(15000, Math.max(defaultDelay, requestedDelay));
          setLlmMessage(
            (stageLabel || "模型服务") + "繁忙，" + Math.ceil(delay / 1000) +
            " 秒后自动重试（" + attempt + "/" + maximumAttempts + "）"
          );
          await waitFor(delay);
          setLlmMessage((stageLabel || "模型服务") + "正在重试（" + (attempt + 1) + "/" + maximumAttempts + "）");
        }
      }
      if (isRetryableLlmError(lastError)) {
        const exhaustedError = new Error("模型服务持续繁忙，已自动重试 3 次，请稍后再试");
        exhaustedError.status = lastError && lastError.status;
        throw exhaustedError;
      }
      throw lastError;
    }

    async function generateSuggestion() {
      if (!appState.currentRecord || appState.loading) return;
      const apiKey = document.getElementById("llmApiKey").value.trim();
      const model = document.getElementById("llmModel").value.trim();
      if (!apiKey) {
        setLlmMessage("请先填写 SiliconFlow API Key", "error");
        return;
      }
      if (!model) {
        setLlmMessage("请填写模型名称", "error");
        return;
      }
      const currentIssues = validateCurrent();
      if (currentIssues.length) {
        setLlmMessage("当前数据格式有问题：" + currentIssues[0], "error");
        return;
      }

      appState.loading = true;
      clearSuggestion();
      const button = document.getElementById("generateSuggestion");
      button.disabled = true;
      button.textContent = "生成中…";
      setLlmMessage("正在生成修改建议，请稍候");
      localStorage.setItem(STORAGE_KEY, apiKey);
      localStorage.setItem(STORAGE_MODEL, model);

      const preserveUser = document.getElementById("preserveUserTurns").checked;
      try {
        let content = await requestLlmJsonWithRetry(apiKey, model, [
          {
            role: "system",
            content: "你是中文情感陪伴评测数据编辑器。严格按用户要求修改，只返回合法 JSON。"
          },
          {
            role: "user",
            content: buildLlmPrompt(preserveUser)
          }
        ], 0.3, "生成服务");
        let parsed;
        try {
          parsed = extractJsonObject(content);
        } catch (parseError) {
          setLlmMessage("模型返回格式异常，正在自动修复 JSON…");
          content = await requestLlmJsonWithRetry(apiKey, model, [
            {
              role: "system",
              content: "你是 JSON 修复器。只修复 JSON 语法，不能删减、概括或改写任何字段内容，只返回合法 JSON 对象。"
            },
            {
              role: "user",
              content: "请把以下内容修复成合法 JSON。根对象必须只有 memory 和 dialogue；dialogue 每项只有 role 和 content。\n\n" + content
            }
          ], 0, "JSON 修复服务");
          parsed = extractJsonObject(content);
        }
        appState.suggestion = normalizeSuggestion(parsed, preserveUser);
        renderSuggestion();
        setLlmMessage("建议已生成，请检查后再应用", "success");
      } catch (error) {
        setLlmMessage("生成失败：" + (error.message || error), "error");
      } finally {
        appState.loading = false;
        button.disabled = false;
        button.textContent = "生成修改建议";
      }
    }

    function renderSuggestion() {
      const suggestion = appState.suggestion;
      if (!suggestion) return;
      document.getElementById("previewMemory").textContent = suggestion.memory;
      const dialogue = document.getElementById("previewDialogue");
      dialogue.replaceChildren();
      suggestion.dialogue.forEach(function(turn) {
        const item = document.createElement("div");
        item.className = "preview-turn";
        const role = document.createElement("strong");
        role.textContent = turn.role === "supporter" ? "星仔" : "用户";
        const text = document.createTextNode(turn.content);
        item.append(role, text);
        dialogue.appendChild(item);
      });
      document.getElementById("suggestionPreview").classList.add("visible");
      document.getElementById("applySuggestion").disabled = false;
      document.getElementById("discardSuggestion").disabled = false;
    }

    function applySuggestion() {
      if (!appState.suggestion) return;
      document.getElementById("memoryInput").value = appState.suggestion.memory;
      appState.dialogue = clone(appState.suggestion.dialogue);
      updateMemoryCount();
      renderDialogue();
      clearSuggestion();
      setLlmMessage("建议已应用到编辑区，确认后请保存", "success");
      markDirty();
    }

    async function boot() {
      document.getElementById("editorName").value = localStorage.getItem(STORAGE_EDITOR) || "";
      document.getElementById("llmApiKey").value =
        localStorage.getItem(STORAGE_KEY) || DEFAULT_SILICONFLOW_API_KEY;
      document.getElementById("llmModel").value =
        localStorage.getItem(STORAGE_MODEL) || DEFAULT_LLM_MODEL;

      try {
        const healthResponse = await fetch(API_HEALTH, { cache: "no-store" });
        if (!healthResponse.ok) throw new Error("健康检查失败");
        const health = await healthResponse.json();
        setConnection(
          "SQLite · " + (health.recordCount == null ? "已连接" : health.recordCount + " 条"),
          "online"
        );

        const responses = await Promise.all([
          fetch(API_SCENES, { cache: "no-store" }),
          fetch(API_WORKSPACE, { cache: "no-store" })
        ]);
        if (!responses[0].ok) throw new Error("读取场景库失败");
        if (!responses[1].ok) throw new Error("读取工作区失败");
        const scenePayload = await responses[0].json();
        const workspace = await responses[1].json();
        appState.scenes = Array.isArray(scenePayload) ? scenePayload : scenePayload.scenes || [];
        appState.sceneById = Object.fromEntries(appState.scenes.map(function(scene) {
          return [scene.id, scene];
        }));
        appState.records = workspace.records || {};
        appState.entries = Object.entries(appState.records).sort(function(a, b) {
          return a[0].localeCompare(b[0], "zh-CN", { numeric: true });
        });
        if (!appState.entries.length) throw new Error("SQLite 中没有可编辑卡片");

        buildSceneAgeIndex();
        populateCategorySelect("");
        const lastKey = localStorage.getItem(STORAGE_LAST_RECORD);
        const firstKey = lastKey && appState.records[lastKey] ? lastKey : appState.entries[0][0];
        showRecord(firstKey, true);
      } catch (error) {
        setConnection("连接失败", "error");
        setSaveState(error.message || String(error), "dirty");
        document.getElementById("dialogueList").innerHTML =
          '<div class="empty">无法读取 SQLite。请从项目根目录运行 node scripts/dev-server.mjs。</div>';
      }
    }

    document.getElementById("categorySelect").addEventListener("change", function(event) {
      const mechanism = populateMechanismSelect(event.target.value, "");
      const ageBand = populateAgeSelect(mechanism, "");
      populateEventSelect(mechanism, ageBand, "");
      const recordKey = selectedRecordKey();
      if (recordKey) showRecord(recordKey, false);
    });
    document.getElementById("mechanismSelect").addEventListener("change", function(event) {
      const mechanism = event.target.value;
      const ageBand = populateAgeSelect(mechanism, "");
      populateEventSelect(mechanism, ageBand, "");
      const recordKey = selectedRecordKey();
      if (recordKey) showRecord(recordKey, false);
    });
    document.getElementById("ageSelect").addEventListener("change", function() {
      const mechanism = document.getElementById("mechanismSelect").value;
      populateEventSelect(mechanism, document.getElementById("ageSelect").value, "");
      const recordKey = selectedRecordKey();
      if (recordKey) showRecord(recordKey, false);
    });
    document.getElementById("eventSelect").addEventListener("change", function() {
      const recordKey = selectedRecordKey();
      if (recordKey) showRecord(recordKey, false);
    });
    document.getElementById("memoryInput").addEventListener("input", function() {
      updateMemoryCount();
      markDirty();
    });
    document.getElementById("revisionInput").addEventListener("input", markDirty);
    document.getElementById("editorName").addEventListener("change", function(event) {
      localStorage.setItem(STORAGE_EDITOR, event.target.value.trim());
    });
    document.getElementById("addPair").addEventListener("click", addDialoguePair);
    document.getElementById("removePair").addEventListener("click", removeDialoguePair);
    document.getElementById("deleteRecord").addEventListener("click", deleteCurrentRecord);
    document.getElementById("toggleHumanReview").addEventListener("click", toggleHumanReview);
    document.getElementById("saveRecord").addEventListener("click", saveCurrentRecord);
    document.getElementById("generateSuggestion").addEventListener("click", generateSuggestion);
    document.getElementById("applySuggestion").addEventListener("click", applySuggestion);
    document.getElementById("discardSuggestion").addEventListener("click", function() {
      clearSuggestion();
      setLlmMessage("已丢弃修改建议");
    });

    window.addEventListener("beforeunload", function(event) {
      if (!appState.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("keydown", function(event) {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveCurrentRecord();
      }
    });

    boot();
  </script>
